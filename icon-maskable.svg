<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (maskable: no rounded corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="256" fill="url(#shine)"/>

  <!-- Wallet body — shifted inward for maskable safe zone (80px padding) -->
  <rect x="110" y="210" width="292" height="172" rx="24" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="18"/>

  <!-- Wallet top flap -->
  <path d="M134 220 V182 C134 170 143 160 156 160 H310" stroke="white" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Coin pocket -->
  <rect x="318" y="266" width="60" height="62" rx="14" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="14"/>

  <!-- Coin -->
  <circle cx="348" cy="297" r="18" fill="white" opacity="0.9"/>
  <circle cx="348" cy="297" r="9" fill="#059669"/>
</svg>
