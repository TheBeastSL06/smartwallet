  /* Supabase */
  const sb = {
    h: t => ({ apikey:SB_KEY, Authorization:'Bearer '+(t||SB_KEY), 'Content-Type':'application/json', Prefer:'return=representation' }),

    async del(tbl, t, id) {

  /* Balance Calculator — uses ALL data (all time) */
  function calcBalances(data) {
    let cash = 0, bank = 0;
    data.income.forEach(i => {
      if ((i.destination||'Bank')==='Cash') cash += Number(i.amount);
      else bank += Number(i.amount);
    });
    data.transactions.forEach(t => {
      if ((t.source||'Cash')==='Cash') cash -= Number(t.amount);
      else bank -= Number(t.amount);
    });
    data.bills.filter(b=>b.paid&&b.amount).forEach(b => {
      if ((b.source||'Bank')==='Cash') cash -= Number(b.amount);
      else bank -= Number(b.amount);
    });
    (data.lendings||[]).forEach(l => {
      const acc = l.account||'Cash', sAcc = l.settlement_account||'Cash';
      if (l.type==='lending') {
        if (acc==='Cash') cash -= Number(l.amount); else bank -= Number(l.amount);
        if (Number(l.settled_amount)>0) { if (sAcc==='Cash') cash+=Number(l.settled_amount); else bank+=Number(l.settled_amount); }
      } else {
        if (acc==='Cash') cash += Number(l.amount); else bank += Number(l.amount);
        if (Number(l.settled_amount)>0) { if (sAcc==='Cash') cash-=Number(l.settled_amount); else bank-=Number(l.settled_amount); }
      }
    });
    (data.transfers||[]).forEach(t => {
      if (t.from_account==='Cash') cash-=Number(t.amount); else bank-=Number(t.amount);
      if (t.to_account==='Cash')   cash+=Number(t.amount); else bank+=Number(t.amount);
    });
    return { cash, bank, total: cash+bank };
  }

  /* Financials for current month */
  function calcFinancials(mData) {
    const tInc   = mData.income.reduce((s,i)=>s+Number(i.amount),0);
    const tBill  = mData.bills.reduce((s,b)=>s+Number(b.amount||0),0);
    const tSpent = mData.transactions.reduce((s,t)=>s+Number(t.amount),0);
    const ls = mData.lendings||[];
    const lentOut  = ls.filter(l=>l.type==='lending').reduce((s,l)=>s+Number(l.amount),0);
    const recovered= ls.filter(l=>l.type==='lending').reduce((s,l)=>s+Number(l.settled_amount),0);
    const borrowed = ls.filter(l=>l.type==='borrowing').reduce((s,l)=>s+Number(l.amount),0);
    const repaid   = ls.filter(l=>l.type==='borrowing').reduce((s,l)=>s+Number(l.settled_amount),0);
    const pendingOwed  = ls.filter(l=>l.type==='lending'&&!l.settled).reduce((s,l)=>s+Number(l.amount)-Number(l.settled_amount),0);
    const pendingOwing = ls.filter(l=>l.type==='borrowing'&&!l.settled).reduce((s,l)=>s+Number(l.amount)-Number(l.settled_amount),0);
    return { tInc, tBill, tSpent, lentOut, recovered, borrowed, repaid, pendingOwed, pendingOwing };
  }

  function smartBudget(disp) {

  /* Calendar View */
  function CalendarView({data, vm, vy}) {
    const [selDay,setSelDay]=useState(null);
    const now=new Date(), curM=vm, curY=vy;
    const m=curM-1, y=curY;
    const dim=new Date(y,m+1,0).getDate(), fd=new Date(y,m,1).getDay();
    const todayD=(vm===CM()&&vy===CY())?now.getDate():-1;

    const mInc  = data.income.filter(i=>i.month===curM&&i.year===curY);
    const mExp  = data.transactions.filter(t=>t.month===curM&&t.year===curY);
    const mTr   = (data.transfers||[]).filter(t=>t.month===curM&&t.year===curY);

    const dd={};
    const push=(day,obj)=>{ if(!dd[day]) dd[day]={inc:0,exp:0,tr:false,items:[]}; Object.assign(dd[day],obj); };
    mInc.forEach(i=>{ const d=parseInt(i.date.split('-')[2]); if(!dd[d]) dd[d]={inc:0,exp:0,tr:false,items:[]}; dd[d].inc+=Number(i.amount); dd[d].items.push({t:'inc',label:i.source,amt:i.amount,acc:i.destination||'Bank'}); });
    mExp.forEach(e=>{ const d=parseInt(e.date.split('-')[2]); if(!dd[d]) dd[d]={inc:0,exp:0,tr:false,items:[]}; dd[d].exp+=Number(e.amount); dd[d].items.push({t:'exp',label:e.category,amt:e.amount,acc:e.source||'Cash'}); });

                  {d&&<div style={{display:'flex',gap:2,justifyContent:'center'}}>
                    {d.inc>0&&<div style={{width:4,height:4,borderRadius:'50%',background:'#10b981'}}/>}

  /* Auth */
  function AuthScreen({onAuth}) {

  /* Dashboard */
  function Dashboard({data,onTransfer,vm,vy}) {
    const balances = calcBalances(data);
    const mInc=data.income.filter(i=>i.month===vm&&i.year===vy), mBill=data.bills.filter(b=>b.month===vm&&b.year===vy), mExp=data.transactions.filter(t=>t.month===vm&&t.year===vy), mLend=data.lendings||[];
    const mData={income:mInc,bills:mBill,transactions:mExp,lendings:mLend};
    const {tInc,tBill,tSpent,lentOut,recovered,borrowed,repaid,pendingOwed,pendingOwing}=calcFinancials(mData);
    const disp=tInc-tBill, budget=smartBudget(disp);
    const normCat=c=>(c==='Food & Groceries'||c==='Eggs & Yoghurts')?'Foods':c;
    const byC={}; mExp.forEach(t=>{const c=normCat(t.category);byC[c]=(byC[c]||0)+Number(t.amount);});

    const td=new Date().getDate(), todayStr=today();
    const alerts=[];
    Object.entries(byC).forEach(([c,sp])=>{ if(!budget[c])return; const r=sp/budget[c].amount; if(r>=1)alerts.push({t:'r',m:'🔴 '+c+' budget exceeded!'}); else if(r>=0.8)alerts.push({t:'y',m:'⚠️ '+c+' at '+Math.round(r*100)+'% — watch this'}); });
    mBill.forEach(b=>{ if(b.due_day&&!b.paid&&b.due_day-td>=0&&b.due_day-td<=5)alerts.push({t:'b',m:'📅 '+b.bill_name+' due on '+ord(b.due_day)}); });
    (data.lendings||[]).filter(l=>!l.settled&&l.due_date&&l.due_date<=todayStr).forEach(l=>{ const over=l.due_date<todayStr; alerts.push({t:'r',m:(over?'🔴 OVERDUE':'📅 Due today')+': '+(l.type==='lending'?'Lent to':'Borrowed from')+' '+l.person_name+' — '+fmt(Number(l.amount)-Number(l.settled_amount))}); });
    const aC=t=>t==='r'?'#f87171':t==='y'?'#fbbf24':'#60a5fa';
    const aB=t=>t==='r'?'#ef444415':t==='y'?'#f59e0b15':'#3b82f615';

    return (

            <p style={{color:'#93c5fd',fontSize:10,margin:'0 0 2px'}}>🏦 Bank Balance</p>
            <h3 style={{color:'#fff',fontSize:20,fontWeight:800,margin:'0 0 4px',fontFamily:'Outfit,sans-serif'}}>{fmtK(balances.bank)}</h3>

          </div>

          <Ic n='transfer' size={16} color='#10b981'/> Bank ↔ Cash Transfer

        {/* This month hero */}

          <div style={{position:'absolute',top:-28,right:-28,width:120,height:120,borderRadius:'50%',background:'rgba(255,255,255,.08)'}}/>
          <p style={{color:'#a7f3d0',fontSize:11,margin:'0 0 2px',fontWeight:500}}>{MONTHS[vm-1]} {vy}{vm===CM()&&vy===CY()?' — This Month':' — Historical'}</p>
          <p style={{color:'rgba(255,255,255,.55)',fontSize:12,margin:0}}>Total Income</p>

            {[['Bills',tBill,'#fca5a5'],['Spent',tSpent,'#fcd34d'],['Lent',lentOut,'#f9a8d4'],['Borrowed',borrowed,'#a5f3fc']].map(([l,v,c])=>(

              const sp=byC[cat]||0, pct=amount>0?Math.min(sp/amount,1):0;
              return <div key={cat} style={{marginBottom:10}}>

                <div style={{background:'#1a2740',borderRadius:4,height:5,overflow:'hidden'}}><div style={{height:'100%',borderRadius:4,width:(pct*100)+'%',background:pct>=1?'#ef4444':pct>=0.8?'#f59e0b':(COLORS[cat]||'#10b981'),transition:'width .5s'}}/></div>
              </div>;
            })}

                  <div style={{background:'#1a2740',borderRadius:6,height:8,overflow:'hidden',marginBottom:4}}><div style={{height:'100%',borderRadius:6,width:pct*100+'%',background:'linear-gradient(90deg,#84cc16,#65a30d)',transition:'width .5s'}}/></div>
                  <Row style={{justifyContent:'space-between',marginBottom:10}}><span style={{color:'#6b7280',fontSize:11}}>Saved: {fmt(g.current_amount)}</span><span style={{color:'#a3e635',fontWeight:600,fontSize:11}}>{Math.round(pct*100)}%</span></Row>
                  <button onClick={()=>setContrib(g)} style={{width:'100%',borderRadius:10,padding:'8px 0',fontSize:12,fontWeight:600,border:'1px solid #10b98133',background:'#10b98115',color:'#10b981',cursor:'pointer',fontFamily:'Outfit,sans-serif'}}>+ Add Savings</button>
                </Card>
              );
            })}
            {data.goals.length===0&&<p style={{color:'#374151',fontSize:13,textAlign:'center',padding:32}}>No savings goals yet</p>}
          </>
        ):(
          <>
            {/* Account Balances */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <Card style={{padding:12,border:'1px solid #10b98133'}}><p style={{color:'#6b7280',fontSize:10,margin:'0 0 2px'}}>💵 Cash Balance</p><p style={{color:'#34d399',fontWeight:700,fontSize:15,margin:0,fontFamily:'Outfit,sans-serif'}}>{fmt(balances.cash)}</p></Card>
              <Card style={{padding:12,border:'1px solid #3b82f633'}}><p style={{color:'#6b7280',fontSize:10,margin:'0 0 2px'}}>🏦 Bank Balance</p><p style={{color:'#60a5fa',fontWeight:700,fontSize:15,margin:0,fontFamily:'Outfit,sans-serif'}}>{fmt(balances.bank)}</p></Card>
            </div>
            {/* True balance breakdown */}
            <Card style={{border:'1px solid #10b98122'}}>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 4px'}}>Total Balance (All Accounts)</p>
              <h2 style={{color:balances.total>=0?'#a3e635':'#f87171',fontSize:26,fontWeight:800,margin:'0 0 12px',fontFamily:'Outfit,sans-serif'}}>{balances.total>=0?'':'-'}{fmt(Math.abs(balances.total))}</h2>
              <Divider/>
              <StatRow label='+ Income' value={fmt(tInc)} color='#34d399'/>
              <StatRow label='+ Borrowed' value={fmt(borrowed)} color='#06b6d4'/>
              <StatRow label='+ Recovered' value={fmt(recovered)} color='#60a5fa'/>
              <StatRow label='− Bills (paid)' value={fmt(tBill)} color='#f87171'/>
              <StatRow label='− Expenses' value={fmt(tSpent)} color='#f59e0b'/>
              <StatRow label='− Lent Out' value={fmt(lentOut)} color='#f43f5e'/>
              <StatRow label='− Repaid' value={fmt(repaid)} color='#fb923c'/>
              {mTransfers>0&&<StatRow label='↔ Transfers' value={fmt(mTransfers)} color='#a78bfa'/>}
              <div style={{height:1,background:'#10b981',margin:'8px 0'}}/>
              <StatRow label='This Month Balance' value={fmt(monthBal)} color={monthBal>=0?'#a3e635':'#f87171'} bold={true}/>
            </Card>
            {/* Lending position */}
            {(pendingOwed>0||pendingOwing>0)&&(
              <Card>
                <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 10px'}}>Outstanding Lending Position</p>
                {pendingOwed>0&&<StatRow label='Others Still Owe You' value={fmt(pendingOwed)} color='#34d399'/>}
                {pendingOwing>0&&<StatRow label='You Still Owe Others' value={fmt(pendingOwing)} color='#f87171'/>}
                <div style={{height:1,background:'#1a2740',margin:'6px 0'}}/>
                <StatRow label='Net Position' value={fmt(pendingOwed-pendingOwing)} color={pendingOwed>=pendingOwing?'#34d399':'#f87171'} bold={true}/>
              </Card>
            )}
            {/* Chart */}
            <Card>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 14px'}}>This Month Cash Flow</p>
              <BarChart data={bars}/>
              <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:10}}>
                {[['#10b981','Income'],['#06b6d4','Borrowed'],['#60a5fa','Recovered'],['#ef4444','Bills'],['#f59e0b','Expenses'],['#f43f5e','Lent'],['#fb923c','Repaid']].map(([c,l])=>(<Row key={l} style={{gap:4}}><div style={{width:6,height:6,borderRadius:'50%',background:c}}/><span style={{color:'#6b7280',fontSize:9}}>{l}</span></Row>))}
              </div>
            </Card>
            {/* Category pie */}
            {pie.length>0&&<Card>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 10px'}}>Expenses by Category</p>
              <Row style={{alignItems:'center'}}>
                <Donut data={pie}/>
                <div style={{flex:1,paddingLeft:10,display:'flex',flexDirection:'column',gap:5}}>
                  {pie.map(d=>{ const tot=pie.reduce((s,x)=>s+x.value,0); const pct=tot>0?Math.round(d.value/tot*100):0; return (<Row key={d.name} style={{gap:5,marginBottom:2}}><div style={{width:7,height:7,borderRadius:'50%',background:COLORS[d.name]||'#64748b',flexShrink:0}}/><span style={{color:'#9ca3af',fontSize:10,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.name}</span><span style={{color:'#a3e635',fontSize:10,fontWeight:600,flexShrink:0,marginRight:4}}>{pct}%</span><span style={{color:'#d1d5db',fontSize:10,flexShrink:0}}>{fmtK(d.value)}</span></Row>); })}
                </div>
              </Row>
            </Card>}
            {/* Income sources */}
            <Card>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 10px'}}>Income Sources</p>
              {Object.entries(bySrc).map(([s,a])=>(<StatRow key={s} label={s} value={fmt(a)} color='#10b981'/>))}
              {!Object.keys(bySrc).length&&<p style={{color:'#374151',fontSize:13,textAlign:'center',padding:16}}>No income recorded</p>}
            </Card>
            {/* Expenses vs Salary */}
            {pie.length>0&&<Card>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 2px'}}>Expenses vs Salary</p>
              <p style={{color:'#4b5563',fontSize:10,margin:'0 0 14px'}}>How much of your salary each category uses</p>
              <HorizCatChart pie={pie} baseline={salary} baseLabel='Salary' baseColor='#10b981'/>
            </Card>}
            {/* Expenses vs Total Income */}
            {pie.length>0&&<Card>
              <p style={{color:'#9ca3af',fontSize:12,margin:'0 0 2px'}}>Expenses vs Total Income</p>
              <p style={{color:'#4b5563',fontSize:10,margin:'0 0 14px'}}>How much of all income each category uses</p>
              <HorizCatChart pie={pie} baseline={tInc} baseLabel='Total Income' baseColor='#34d399'/>
            </Card>}
          </>
        )}
        {showAdd&&<Modal title='New Savings Goal' onClose={()=>setShowAdd(false)}><FInput label='Goal Name' placeholder='e.g. Emergency Fund…' value={gForm.name} onChange={e=>setGForm({...gForm,name:e.target.value})}/><FInput label='Target Amount (LKR)' type='number' inputMode='decimal' placeholder='100000' value={gForm.target_amount} onChange={e=>setGForm({...gForm,target_amount:e.target.value})}/><FInput label='Target Date (optional)' type='date' value={gForm.target_date} onChange={e=>setGForm({...gForm,target_date:e.target.value})}/>{sug>0&&<div style={{borderRadius:12,padding:12,marginBottom:14,fontSize:12,color:'#10b981',background:'#10b98115'}}>💡 App will assign {fmt(sug)}/month as your contribution</div>}<Btn onClick={addGoal} disabled={busy||!gForm.name||!gForm.target_amount}>{busy?'Saving…':'Create Goal'}</Btn></Modal>}
        {contrib&&<Modal title={'Add to: '+contrib.name} onClose={()=>setContrib(null)}><FInput label='Amount (LKR)' type='number' inputMode='decimal' placeholder='0.00' value={cAmt} onChange={e=>setCAmt(e.target.value)}/><Btn onClick={()=>addC(contrib)} disabled={busy||!cAmt}>{busy?'Saving…':'Add to Goal'}</Btn></Modal>}
      </div>
    );
  }

  /* Main App */
  function App() {
    const [token,setToken]=useState(null),[user,setUser]=useState(null),[tab,setTab]=useState('home');
    const [viewMonth,setViewMonth]=useState(CM()),[viewYear,setViewYear]=useState(CY());
    const prevMonth=()=>{if(viewMonth===1){setViewMonth(12);setViewYear(viewYear-1);}else setViewMonth(viewMonth-1);};
    const nextMonth=()=>{const nm=viewMonth===12?1:viewMonth+1,ny=viewMonth===12?viewYear+1:viewYear;if(ny>CY()||(ny===CY()&&nm>CM()))return;setViewMonth(nm);setViewYear(ny);};
    const isCurr=viewMonth===CM()&&viewYear===CY();
    const [data,setData]=useState({income:[],bills:[],transactions:[],goals:[],lendings:[],transfers:[]});
    const [loading,setLoading]=useState(false),[error,setError]=useState(''),[showTransfer,setShowTransfer]=useState(false);

    const load=useCallback(async(tok,uid)=>{
      if(!tok||!uid)return; setLoading(true); setError('');
      try {
        const uq='user_id=eq.'+uid;
        const [income,bills,transactions,goals,lendings,transfers]=await Promise.all([
          sb.get('income_entries',tok,uq), sb.get('mandatory_bills',tok,uq),
          sb.get('transactions',tok,uq),   sb.get('savings_goals',tok,uq),
          sb.get('lendings',tok,uq),       sb.get('transfers',tok,uq),
        ]);
        setData({income,bills,transactions,goals,lendings,transfers});
      } catch{setError('Failed to load. Check connection.');}
      setLoading(false);
    },[]);

    const handleAuth=(tok,usr)=>{setToken(tok);setUser(usr);load(tok,usr.id);};
    const refresh=()=>load(token,user&&user.id);
    const logout=async()=>{ try{await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+token}});}catch{} setToken(null);setUser(null); };

    if(!token) return <AuthScreen onAuth={handleAuth}/>;

    const TABS=[{id:'home',ic:'home',lb:'Home'},{id:'income',ic:'dollar',lb:'Income'},{id:'bills',ic:'receipt',lb:'Bills'},{id:'expenses',ic:'wallet',lb:'Expenses'},{id:'lend',ic:'swap',lb:'Lend'},{id:'more',ic:'dots',lb:'More'}];
    const TITLES={home:'Dashboard',income:'Income',bills:'Bills',expenses:'Expenses',lend:'Lend / Borrow',more:'More'};
    const SCREENS={
      home:     <Dashboard     data={data} onTransfer={()=>setShowTransfer(true)} vm={viewMonth} vy={viewYear}/>,
      income:   <IncomeScreen  token={token} userId={user&&user.id} data={data} onRefresh={refresh} vm={viewMonth} vy={viewYear}/>,
      bills:    <BillsScreen   token={token} userId={user&&user.id} data={data} onRefresh={refresh} vm={viewMonth} vy={viewYear}/>,
      expenses: <ExpensesScreen token={token} userId={user&&user.id} data={data} onRefresh={refresh} vm={viewMonth} vy={viewYear}/>,
      lend:     <LendingScreen  token={token} userId={user&&user.id} data={data} onRefresh={refresh}/>,
      more:     <MoreScreen     token={token} userId={user&&user.id} data={data} onRefresh={refresh} vm={viewMonth} vy={viewYear}/>,
    };

    return (
      <div style={{background:'#070d1b',minHeight:'100vh',fontFamily:'Outfit,sans-serif',maxWidth:480,margin:'0 auto'}}>
        <div style={{position:'sticky',top:0,zIndex:40,background:'#070d1b'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderBottom:'1px solid #121c30'}}>
            <div><h1 style={{color:'#fff',fontSize:18,fontWeight:700,margin:'0 0 1px',fontFamily:'Outfit,sans-serif'}}>{TITLES[tab]}</h1><p style={{color:'#374151',fontSize:10,margin:0}}>{user&&user.email&&user.email.split('@')[0]}</p></div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={refresh} style={{width:36,height:36,borderRadius:'50%',background:'#121c30',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><Ic n='refresh' size={15} color={loading?'#10b981':'#9ca3af'}/></button>
              <button onClick={logout}  style={{width:36,height:36,borderRadius:'50%',background:'#121c30',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><Ic n='logout' size={15} color='#9ca3af'/></button>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 16px',borderBottom:'1px solid #121c30',background:'#0c1525'}}>
            <button onClick={prevMonth} style={{width:30,height:30,borderRadius:'50%',background:'#1a2740',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#9ca3af',fontSize:18,lineHeight:1}}>‹</button>
            <div style={{textAlign:'center'}}>
              <span style={{color:isCurr?'#10b981':'#f59e0b',fontSize:13,fontWeight:700,fontFamily:'Outfit,sans-serif'}}>{MONTHS[viewMonth-1]} {viewYear}</span>
              {!isCurr&&<span style={{color:'#f59e0b',fontSize:9,display:'block',fontWeight:500,marginTop:1}}>📅 Historical View</span>}
            </div>
            <button onClick={nextMonth} disabled={isCurr} style={{width:30,height:30,borderRadius:'50%',background:isCurr?'transparent':'#1a2740',border:'none',display:'flex',alignItems:'center',justifyContent:'center',cursor:isCurr?'default':'pointer',color:isCurr?'#2d3748':'#9ca3af',fontSize:18,lineHeight:1}}>›</button>
          </div>
        </div>
        {error&&<div style={{margin:'8px 16px',borderRadius:12,padding:12,fontSize:12,color:'#f87171',background:'#ef444415'}}>{error}</div>}
        <div style={{padding:'14px 14px 110px'}}>
          {loading&&!data.income.length
            ?<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'80px 0',gap:12}}><div style={{width:40,height:40,borderRadius:'50%',border:'3px solid #10b981',borderTopColor:'transparent',animation:'spin 1s linear infinite'}}/><p style={{color:'#6b7280',fontSize:13,margin:0}}>Loading your data…</p></div>
            :SCREENS[tab]
          }
        </div>
        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:480,background:'#0c1525',borderTop:'1px solid #1a2740',zIndex:40,paddingBottom:'env(safe-area-inset-bottom,4px)'}}>
          <div style={{display:'flex'}}>
            {TABS.map(({id,ic,lb})=>(<button key={id} onClick={()=>setTab(id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3,padding:'9px 0',border:'none',background:'transparent',cursor:'pointer',color:tab===id?'#10b981':'#374155',transition:'color .2s',fontFamily:'Outfit,sans-serif'}}><Ic n={ic} size={19} color={tab===id?'#10b981':'#374155'}/><span style={{fontSize:9,fontWeight:tab===id?600:400}}>{lb}</span></button>))}
          </div>
        </div>
        {showTransfer&&<TransferModal token={token} userId={user&&user.id} onClose={()=>setShowTransfer(false)} onRefresh={refresh}/>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)); });
  }
</script>
</body>
</html>
