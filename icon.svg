<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="112" fill="url(#shine)"/>

  <!-- Wallet body (main card) -->
  <rect x="80" y="192" width="352" height="208" rx="28" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="20"/>

  <!-- Wallet top flap -->
  <path d="M108 204 V160 C108 147 118 136 132 136 H320" stroke="white" stroke-width="20" stroke-linecap="round" fill="none"/>

  <!-- Coin slot pocket -->
  <rect x="300" y="256" width="106" height="80" rx="16" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="16"/>

  <!-- Coin inside pocket -->
  <circle cx="353" cy="296" r="22" fill="white" opacity="0.9"/>
  <circle cx="353" cy="296" r="11" fill="#059669"/>
</svg>
